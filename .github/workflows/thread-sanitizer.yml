name: Thread Sanitizer

# The package's tests under Thread Sanitizer: weekly, and on demand. Time
# limits stretch under the sanitizer (Tests/TestSupport/TimeLimits.swift).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  package:
    name: Package (Thread Sanitizer)
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Restore bundled git
        uses: actions/cache@v6
        with:
          path: Vendor/git
          key: vendor-git-${{ hashFiles('scripts/git-version', 'scripts/git-checksums') }}

      - name: Install bundled git
        run: scripts/fetch-git.sh

      - name: Test
        working-directory: Packages/EspalierKit
        run: swift test --sanitize=thread --only-use-versions-from-resolved-file --disable-index-store
